<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pull the Goalie Live overlay</title>
<meta name="author" content="John Khan">
<style>
  body{margin:0;background:transparent;font:600 18px/1.3 system-ui,sans-serif;color:#fff}
  .box{display:inline-block;margin:16px;padding:14px 18px;border-radius:14px;background:rgba(11,27,59,.92);min-width:360px}
  .row{display:flex;justify-content:space-between;gap:16px}.score{font-size:28px;font-weight:900}
  .call{margin-top:8px;font-size:30px;font-weight:900}.pull{color:#ff4d5e}.wait{color:#9fd0ff}
  .bar{height:12px;background:#9fd0ff;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#ff4d5e}
  small{opacity:.8;font-weight:500}
</style>
</head>
<body>
<!-- Usage: overlay.html?game=2026020150&api=http://localhost:8787  (add &at=240 to replay a finished game) -->
<div class="box">
  <div class="row"><span id="teams">Loading</span><span class="score" id="score"></span></div>
  <small id="clock"></small>
  <div class="call" id="call"></div>
  <small id="detail"></small>
  <div class="bar"><i id="votebar" style="width:50%"></i></div>
  <small id="votes">Chat: type !pull or !wait</small>
</div>
<script>
const q = new URLSearchParams(location.search);
const api = q.get("api") || "http://localhost:8787", game = q.get("game"), at = q.get("at");
const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
async function tick() {
  try {
    const s = await (await fetch(`${api}/state?game=${game}${at ? `&at=${at}` : ""}`)).json();
    const [h, a] = s.teams;
    document.getElementById("teams").textContent = `${a.team} at ${h.team}`;
    document.getElementById("score").textContent = `${a.score} : ${h.score}`;
    document.getElementById("clock").textContent = `Period ${s.period}, ${s.clock} left`;
    const t = s.teams.find((x) => x.deficit < 0);
    const c = document.getElementById("call"), d = document.getElementById("detail");
    if (!t) { c.textContent = "Tie game"; c.className = "call"; d.textContent = ""; }
    else {
      const k = t.call;
      c.textContent = k.action === "PULL" ? `${t.team}: PULL NOW` : `${t.team}: WAIT ${clock(k.seconds_until)}`;
      c.className = `call ${k.action === "PULL" ? "pull" : "wait"}`;
      d.textContent = `Model's best pull time: ${clock(k.pull_at)} left${t.goalie_in ? "" : " (goalie is already out)"}`;
    }
    const v = await (await fetch(`${api}/votes?game=${game}`)).json();
    const n = v.pull + v.wait;
    document.getElementById("votebar").style.width = `${n ? (v.pull / n) * 100 : 50}%`;
    document.getElementById("votes").textContent = `Chat: ${v.pull} pull, ${v.wait} wait`;
  } catch (e) { document.getElementById("teams").textContent = "Waiting for the local server"; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
